<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f5f7f6; color:#333; font-size:14px; }
  /* 顶部栏 */
  .topbar { background:#fff; height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid #eee; }
  .topbar .nav { display:flex; align-items:center; gap:28px; height:100%; font-size:14px; }
  .topbar .nav a { display:flex; align-items:center; gap:7px; height:100%; color:#666; text-decoration:none; border-bottom:2.5px solid transparent; padding:0 2px; cursor:pointer; }
  .topbar .nav a:hover { color:#00a870; }
  .topbar .nav a.active { color:#00a870; font-weight:600; border-bottom-color:#00a870; }
  .topbar .nav .dot { width:16px; height:16px; border-radius:3px; background:#00a870; display:inline-block; flex-shrink:0; }
  .topbar .right { color:#555; font-size:13px; display:flex; align-items:center; gap:14px; }
  .topbar .right .avatar { width:26px; height:26px; border-radius:50%; background:#00a870; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:12px; }
  .page-head { background:linear-gradient(135deg,#00a870,#008f5f); color:#fff; padding:18px 28px; }
  .page-head h1 { font-size:20px; font-weight:600; }
  .page-head p { font-size:12px; opacity:.85; margin-top:4px; }
  .container { max-width:1280px; margin:0 auto; padding:16px 20px 40px; }
  /* 汇总卡片 */
  .stat-cards { display:flex; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-card { background:#fff; border-radius:8px; padding:14px 20px; flex:1; min-width:170px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .stat-card .label { color:#888; font-size:12px; }
  .stat-card .value { font-size:22px; font-weight:700; margin-top:4px; }
  .stat-card .value.green { color:#00a870; }
  .stat-card .value.orange { color:#ff8f1f; }
  .stat-card .value.blue { color:#2f7bff; }
  /* 归档规则说明 */
  .archive-note { background:#e8f7f1; border:1px solid #bfe8d6; border-radius:8px; padding:10px 16px; margin-bottom:16px; color:#007951; font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .archive-note b { color:#00563a; }
  .archive-note .tag-auto { background:#00a870; color:#fff; border-radius:3px; padding:1px 8px; font-size:12px; }
  /* 工具栏 */
  .toolbar { background:#fff; border-radius:8px; padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .toolbar label { color:#555; }
  select, input[type=text], input[type=number] { border:1px solid #dcdfe6; border-radius:4px; padding:7px 10px; font-size:13px; outline:none; font-family:inherit; background:#fff; }
  select:focus, input:focus { border-color:#00a870; }
  .btn { border:none; border-radius:4px; padding:8px 16px; cursor:pointer; font-size:13px; transition:.15s; }
  .btn-primary { background:#00a870; color:#fff; }
  .btn-primary:hover { background:#009164; }
  .btn-plain { background:#fff; border:1px solid #00a870; color:#00a870; }
  .btn-plain:hover { background:#e8f7f1; }
  /* 表格 */
  .table-wrap { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.05); overflow:auto; }
  table { width:100%; border-collapse:collapse; min-width:1240px; }
  th { background:#fafafa; color:#666; font-weight:600; text-align:left; padding:12px 14px; border-bottom:1px solid #ebeef5; white-space:nowrap; }
  td { padding:12px 14px; border-bottom:1px solid #f2f3f5; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:#f7fbf9; }
  .code-link { color:#00a870; font-weight:600; cursor:pointer; }
  .code-link:hover { text-decoration:underline; }
  .op-link { color:#00a870; cursor:pointer; margin-right:12px; white-space:nowrap; }
  .op-link:hover { text-decoration:underline; }
  .tag { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; }
  .tag-wheat { background:#fbf3e2; color:#b8860b; }
  .tag-chili { background:#fdeaea; color:#d64545; }
  .tag-corn { background:#fff3df; color:#c77c0d; }
  .tag-done { background:#e8f7f1; color:#00a870; }
  .pager { display:flex; justify-content:flex-end; align-items:center; gap:8px; padding:12px 16px; color:#666; font-size:13px; }
  .pager .pg { min-width:26px; height:26px; border:1px solid #dcdfe6; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; background:#fff; }
  .pager .pg.active { background:#00a870; color:#fff; border-color:#00a870; }
  /* 抽屉（档案详情） */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:90; }
  .drawer { position:fixed; top:0; right:-820px; width:820px; max-width:96vw; height:100vh; background:#f7f9f8; z-index:100; transition:right .25s ease; display:flex; flex-direction:column; box-shadow:-4px 0 16px rgba(0,0,0,.12); }
  .drawer.open { right:0; }
  .drawer-head { background:#fff; padding:14px 22px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
  .drawer-head h3 { font-size:16px; }
  .drawer-head .sub { color:#999; font-size:12px; margin-top:3px; }
  .close-x { cursor:pointer; color:#999; font-size:20px; line-height:1; }
  .close-x:hover { color:#333; }
  .drawer-body { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 22px 30px; }
  /* 档案头卡片（仿种植详情弹窗） */
  .arch-head { background:#fff; border-radius:8px; border-left:4px solid #00a870; padding:16px 20px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .arch-head h2 { font-size:18px; font-weight:700; }
  .arch-head h2 .area { color:#00a870; }
  .arch-head .row { margin-top:8px; font-size:13.5px; color:#444; }
  .arch-head .row b { color:#00a870; font-weight:600; }
  .arch-head .row .lbl { color:#888; margin-right:6px; }
  .arch-tabs { display:flex; background:#fff; border-radius:8px 8px 0 0; margin-top:14px; border-bottom:1px solid #eee; padding:0 10px; }
  .arch-tab { padding:12px 22px; cursor:pointer; font-size:14px; color:#666; border-bottom:2px solid transparent; }
  .arch-tab.active { color:#00a870; font-weight:600; border-bottom-color:#00a870; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  /* 完成度 */
  .progress-line { background:#fff; border-radius:8px; padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px; border:1px solid #eef0ef; }
  .progress-line .bar { flex:1; height:8px; background:#eef1ef; border-radius:4px; overflow:hidden; }
  .progress-line .bar i { display:block; height:100%; background:linear-gradient(90deg,#00a870,#3ecf95); border-radius:4px; }
  .progress-line .txt { color:#666; font-size:13px; white-space:nowrap; }
  /* 农事环节卡片 */
  .stage { background:#fff; border-radius:8px; border:1px solid #eef0ef; margin-bottom:10px; padding:12px 16px; cursor:pointer; }
  .stage:hover { border-color:#bfe8d6; box-shadow:0 2px 8px rgba(0,168,112,.10); }
  .stage-top { display:flex; align-items:center; gap:10px; }
  .badge { padding:2px 10px; border-radius:3px; color:#fff; font-size:12px; white-space:nowrap; }
  .badge.done { background:#00a870; }
  .badge.todo { background:#f56c6c; }
  .stage-name { font-weight:700; font-size:14.5px; }
  .stage-date { margin-left:auto; color:#888; font-size:12.5px; }
  .stage-costs { margin-top:8px; padding-top:8px; border-top:1px dashed #e5e8e6; font-size:13px; color:#555; }
  .stage-costs .line { display:flex; justify-content:space-between; padding:2px 0; }
  .stage-costs .line .k { color:#777; }
  .stage-costs .line .v { color:#444; }
  .stage-costs .sum { margin-top:6px; padding-top:6px; border-top:1px solid #f0f2f1; font-weight:700; color:#00a870; display:flex; justify-content:space-between; }
  .stage-costs .sum .per { font-weight:400; color:#00a870; font-size:12.5px; }
  .stage.todo .stage-costs { color:#999; }
  /* 投入分析 */
  .ana-card { background:#fff; border-radius:8px; border:1px solid #eef0ef; padding:14px 18px; margin-bottom:12px; }
  .ana-card h4 { font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .ana-card h4::before { content:""; width:3px; height:13px; background:#00a870; border-radius:2px; display:inline-block; }
  .ana-total { display:flex; gap:30px; flex-wrap:wrap; }
  .ana-total .item .l { color:#888; font-size:12px; }
  .ana-total .item .v { font-size:20px; font-weight:700; color:#00a870; margin-top:2px; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px; }
  .bar-row .bl { width:88px; color:#666; text-align:right; flex-shrink:0; }
  .bar-row .btrack { flex:1; height:14px; background:#f2f4f3; border-radius:7px; overflow:hidden; }
  .bar-row .btrack i { display:block; height:100%; border-radius:7px; }
  .bar-row .bv { width:200px; color:#555; white-space:nowrap; }
  /* 投入分析：环形图版式 */
  .ana-headline { font-size:14.5px; color:#333; margin-bottom:8px; }
  .ana-headline .money { color:#ff6a2b; font-size:20px; font-weight:700; }
  .ana-headline .per { color:#ff6a2b; font-weight:600; margin-left:10px; }
  .legend { display:flex; gap:20px; justify-content:center; margin:2px 0 12px; font-size:12.5px; color:#555; flex-wrap:wrap; }
  .legend .lg { display:inline-flex; align-items:center; gap:6px; }
  .legend .lg i { width:22px; height:12px; border-radius:3px; display:inline-block; }
  .cat-table { width:100%; border-collapse:collapse; font-size:13px; }
  .cat-table th { background:#f5faf7; padding:8px 12px; color:#556; font-weight:600; text-align:left; }
  .cat-table td { padding:8px 12px; border-bottom:1px solid #f0f2f1; color:#444; }
  .cat-chip { display:inline-block; border-radius:4px; padding:3px 14px; font-size:12.5px; font-weight:600; }
  /* 农事详情弹窗 */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:none; align-items:flex-start; justify-content:center; }
  .modal { background:#fff; border-radius:8px; width:560px; max-width:92vw; margin-top:7vh; max-height:86vh; overflow-y:auto; }
  .modal-head { display:flex; justify-content:space-between; align-items:center; padding:16px 22px; border-bottom:1px solid #f0f0f0; }
  .modal-head h3 { font-size:15px; }
  .modal-body { padding:18px 26px; }
  .d-row { display:flex; margin-bottom:13px; }
  .d-row .dl { width:92px; color:#888; flex-shrink:0; }
  .d-row .dv { flex:1; color:#333; }
  .d-row .dv .ok { color:#00a870; }
  .chip { display:inline-block; background:#f2f7f4; border:1px solid #dcefe6; color:#007951; border-radius:4px; padding:3px 12px; font-size:12.5px; margin:0 8px 6px 0; }
  .img-ph { display:inline-flex; width:64px; height:48px; background:#eef2f0; border-radius:4px; align-items:center; justify-content:center; color:#b8c4be; font-size:11px; margin-right:8px; }
  .modal-foot { padding:12px 24px 20px; text-align:right; }
  .toast { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#00a870; color:#fff; padding:10px 22px; border-radius:6px; z-index:300; display:none; box-shadow:0 4px 14px rgba(0,168,112,.4); }
</style>
</head>

/* ================= 工具函数 ================= */
const fmt = n => (Math.round(n*100)/100).toLocaleString("zh-CN", {maximumFractionDigits:2});
const fmt2 = n => (Math.round(n*100)/100).toLocaleString("zh-CN", {minimumFractionDigits:2, maximumFractionDigits:2}); // 金额固定两位小数
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",2200); }
function hide(id){ document.getElementById(id).style.display="none"; }
function show(id){ document.getElementById(id).style.display="flex"; }
function stageTotal(st){ const c = st.costs||{}; return (c.o||0)+(c.a||0)+(c.l||0)+(c.m||0); }
function archTotal(a){ return a.stages.reduce((s,st)=>s+stageTotal(st),0); }
function doneCount(a){ return a.stages.filter(s=>s.status==="done").length; }
function days(a){ return Math.max(1, Math.round((new Date(a.endDate) - new Date(a.startDate))/86400000)); }
function cropTag(crop){ const cls = crop==="小麦" ? "tag-wheat" : crop==="辣椒" ? "tag-chili" : "tag-corn"; return `<span class="tag ${cls}">${crop}</span>`; }

/* 地块形状图标：青色边框小框 + 渐变绿色多边形（模拟地块轮廓，按档案轮换形状） */
const PLOT_SHAPES = [
  "5,16 10,5 23,4 24,17",          // 类似截图的不规则四边形
  "4,15 9,4 21,6 24,16",           // 左低右高四边形
  "4,7 17,3 24,11 21,18 6,18",     // 五边形
  "6,4 22,6 20,17 8,19"            // 平行四边形
];
function plotShape(a){
  const pts = PLOT_SHAPES[(a.id||0) % PLOT_SHAPES.length];
  return `<svg class="plot-shape" viewBox="0 0 28 22" width="22" height="17" style="vertical-align:-3px;margin-right:5px"><rect x="1" y="1" width="26" height="20" fill="#fff" stroke="#2aa79f" stroke-width="1.5" rx="1"/><polygon points="${pts}" fill="url(#plotGrad)" stroke="#1d7f35" stroke-width="0.6"/></svg>`;
}
function catLines(st, area){
  const c = st.costs||{}, map = [["o","其他成本"],["a","农资成本"],["l","人工成本"],["m","农机成本"]];
  return map.filter(([k])=>c[k]).map(([k,label]) =>
    `<div class="line"><span class="k">${label}：</span><span class="v">共¥${fmt2(c[k])}≈¥${fmt2(c[k]/area)}/亩</span></div>`).join("");
}

/* ================= 投入分析：环形图（参考平台截图样式） ================= */
const CATS = { a:["农资","#f25a5a","#fdeaea"], l:["人工服务","#5cbf3a","#ecf8e3"], m:["农机服务","#ffab2e","#fff4e0"], o:["其他服务","#2fc6d4","#e2f7f9"] };
function trimPct(x){ return String(+(x).toFixed(2)); }
function donutSVG(items, total){
  items = items.filter(([,v])=>v>0); // 零值分类不参与扇区与标签
  const W=460,H=280,cx=230,cy=140,R=80,r=50;
  const P=(rad,t)=>[cx+rad*Math.sin(t), cy-rad*Math.cos(t)];
  let paths="", metas=[];
  if(items.length===1){
    const [k,v]=items[0];
    paths=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${CATS[k][1]}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/>`;
    metas=[{k, v, mid:0}];
  } else {
    let ang=0;
    items.forEach(([k,v])=>{
      const a0=ang, a1=ang + v/total*2*Math.PI; ang=a1;
      const large=(a1-a0)>Math.PI?1:0;
      const [x0,y0]=P(R,a0),[x1,y1]=P(R,a1),[x2,y2]=P(r,a1),[x3,y3]=P(r,a0);
      paths+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${r} ${r} 0 ${large} 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${CATS[k][1]}" stroke="#fff" stroke-width="1.5"/>`;
      metas.push({k, v, mid:(a0+a1)/2});
    });
  }
  // 外部标签：按左右两侧分配，自上而下排布并防重叠
  ["l","r"].forEach(side=>{
    const arr = metas.filter(m=>(Math.sin(m.mid)>=0?"r":"l")===side)
      .sort((a,b)=>(cy-(R+30)*Math.cos(a.mid))-(cy-(R+30)*Math.cos(b.mid)));
    let y=22;
    arr.forEach(m=>{ m.ly=Math.max(y, Math.min(cy-(R+30)*Math.cos(m.mid)-8, H-46)); y=m.ly+42; });
  });
  let labels="";
  metas.forEach(m=>{
    const side = Math.sin(m.mid)>=0 ? "r":"l";
    const [dx,dy]=P(R+5,m.mid), [ex,ey]=P(R+24,m.mid);
    const ly=m.ly, lcy=ly+10, tx = side==="r" ? 334 : 126;
    labels+=`<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="3" fill="${CATS[m.k][1]}"/>
      <polyline points="${dx.toFixed(1)},${dy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)} ${side==="r"?tx-8:tx+8},${lcy}" fill="none" stroke="${CATS[m.k][1]}" stroke-width="1"/>
      <text x="${tx}" y="${ly+10}" text-anchor="${side==="r"?"start":"end"}" font-size="12.5" fill="#555">${CATS[m.k][0]} ${fmt2(m.v)}元</text>
      <text x="${tx}" y="${ly+27}" text-anchor="${side==="r"?"start":"end"}" font-size="12" fill="#888">${trimPct(m.v/total*100)}%</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block;margin:0 auto">
    ${paths}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="17" font-weight="700" fill="#ff6a2b">¥${fmt2(total)}</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="12" fill="#999">共 计</text>
    ${labels}</svg>`;
}

}

    <div class="d-row"><div class="dl">所用成本：</div><div class="dv">${st.status==='done'?`共¥${fmt2(t)}≈¥${fmt2(t/a.area)}/亩`:"未执行，无成本"}</div></div>`;
  show("stageModal");
}

initFilters();
renderTable();
</script>
</body>
